<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <title>ESMA fund-name guidelines: What “sustainable” funds changed</title>

  <!-- Keep OG tags neutral; update og:url + og:image once hosted on charts.urgewald.org -->
  <meta property="og:title" content="ESMA fund-name guidelines: what changed" />
  <meta property="og:description"
    content="Sankey chart showing how investments changed before/after ESMA fund-name guidelines (PAB exclusions)." />
  <meta property="og:image" content="./assets/img/title_pic.png" />
  <meta property="og:url" content="./" />

  <!-- ✅ Local (vendored) libraries (NO CDN) -->
  <script src="./vendor/d3.v7.min.js"></script>
  <script src="./vendor/d3-sankey.min.js"></script>

  <style>
    /* ✅ Local fonts (NO Google Fonts). If fonts are missing, browser falls back to sans-serif. */
    @font-face {
      font-family: "Barlow";
      src: url("./assets/fonts/barlow-v13-latin-regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Barlow";
      src: url("./assets/fonts/barlow-v13-latin-600.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Barlow";
      src: url("./assets/fonts/barlow-v13-latin-700.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family: Barlow, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    #controls {
      margin: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    #controls label {
      font-size: 14px;
      margin-right: 6px;
    }

    #controls select {
      font-size: 14px;
      padding: 4px 6px;
      font-family: Barlow, sans-serif;
    }

    #chartWrap {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #chart {
      flex: 1;
      width: 100%;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    #downloads {
      margin: 6px 0 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    #downloads button {
      font-size: 12px;
      padding: 4px 10px;
      font-family: Barlow, sans-serif;
      cursor: pointer;
      background: #f5f5f5;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      color: #333;
    }

    #downloads button:hover {
      background: #eeeeee;
    }

    .link {
      fill: none;
      stroke-opacity: 0.5;
      transition: stroke-opacity 0.2s;
    }

    .link.highlight {
      stroke-opacity: 0.9;
    }

    .dimmed .link:not(.highlight) {
      stroke-opacity: 0.3;
    }

    .node rect {
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .node.highlight rect {
      opacity: 1 !important;
    }

    .dimmed .node rect:not(.highlight) {
      opacity: 0.3;
    }

    .tooltip {
      position: absolute;
      background: lightgrey;
      padding: 6px;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    /* Optional: show a red debug line if something fails */
    #debug {
      display: none;
      margin-top: 6px;
      font-size: 12px;
      color: #b00020;
      max-width: min(1100px, calc(100% - 48px));
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- Controls: language only -->
  <div id="controls">
    <label for="langSelect" id="langLabel">Sprache:</label>
    <select id="langSelect">
      <option value="de" selected>Deutsch</option>
      <option value="en">English</option>
    </select>
  </div>

  <div id="chartWrap">
    <div id="chart"></div>
    <div id="debug"></div>

    <div id="downloads" aria-label="downloads">
      <button id="btnSvg" type="button">SVG herunterladen</button>
      <button id="btnPng" type="button">PNG herunterladen</button>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script>
    // ============================================================
    // Helpers (debug + guardrails)
    // ============================================================
    const debugEl = document.getElementById("debug");
    function showDebug(msg) {
      debugEl.style.display = "block";
      debugEl.textContent = msg;
    }

    // Guardrails: fail early with a helpful message
    if (typeof d3 === "undefined") {
      showDebug("Fehler: d3 wurde nicht geladen. Prüfe ./vendor/d3.v7.min.js (Pfad/Dateiname).");
      throw new Error("d3 not loaded");
    }
    if (typeof d3.sankey !== "function") {
      showDebug("Fehler: d3-sankey wurde nicht geladen. Prüfe ./vendor/d3-sankey.min.js (Pfad/Dateiname).");
      throw new Error("d3-sankey not loaded");
    }

    // ============================================================
    // Language strings
    // ============================================================
    const I18N = {
      de: {
        langLabel: "Sprache:",
        btnSvg: "SVG herunterladen",
        btnPng: "PNG herunterladen",
        colLeft: "Vor ESMA-Leitlinien",
        colRight: "Aktuellstes Portfolio",
        labels: {
          left_fossil: ["Ausgangsbestand"],
          right_esi: ["Weiterhin investiert,", "Fondsname unverändert"],
          right_renamed: ["Weiterhin investiert,", "Fondsname geändert"],
          right_divested: ["Divestment"],
          right_bought: ["Zugekauft"],
        },
        formatMio: (num) => `${new Intl.NumberFormat("de-DE", { maximumFractionDigits: 0 }).format(num)} Mio. €`,
      },
      en: {
        langLabel: "Language:",
        btnSvg: "Download SVG",
        btnPng: "Download PNG",
        colLeft: "Pre ESMA guidelines",
        colRight: "Latest portfolio",
        labels: {
          left_fossil: ["Initial holdings"],
          right_esi: ["Still invested,", "name unchanged"],
          right_renamed: ["Still invested,", "name changed"],
          right_divested: ["Divested"],
          right_bought: ["Bought"],
        },
        formatMio: (num) => `€${new Intl.NumberFormat("en-GB", { maximumFractionDigits: 0 }).format(num)}m`,
      }
    };

    // ============================================================
    // Fixed dataset prefix: ONLY PAB
    // ============================================================
    const DATA_PREFIX = "esi_pab";

    // ============================================================
    // Language via query parameter ?lang=de|en
    // ============================================================
    function getInitialLang() {
      const p = new URLSearchParams(window.location.search);
      const q = (p.get("lang") || "").toLowerCase();
      if (q === "de" || q === "en") return q;

      // Optional fallback: browser language
      const nav = (navigator.language || "").toLowerCase();
      if (nav.startsWith("en")) return "en";
      return "de";
    }

    function setLangInUrl(lang) {
      const url = new URL(window.location.href);
      url.searchParams.set("lang", lang);
      window.history.replaceState({}, "", url.toString());
    }

    // Set language from query (and sync dropdown)
    let currentLang = getInitialLang();
    document.getElementById("langSelect").value = currentLang;

    // ============================================================
    // Dimensions
    // ============================================================
    const margin = { top: 40, right: 330, bottom: 40, left: 260 };
    const fullW = 1240, fullH = 500;
    const width = fullW - margin.left - margin.right;
    const height = fullH - margin.top - margin.bottom;

    // SVG setup (kept constant; we clear inner group on redraw)
    const svgRoot = d3.select("#chart")
      .append("svg")
      .attr("viewBox", `0 0 ${fullW} ${fullH}`)
      .attr("preserveAspectRatio", "xMinYMin meet");

    const svg = svgRoot.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    const tooltip = d3.select("#tooltip");

    // ============================================================
    // Formatting / label helpers
    // ============================================================
    function formatMio(v) {
      return I18N[currentLang].formatMio(v);
    }

    function labelLines(name, isBuy = false) {
      const L = I18N[currentLang].labels;
      if (name === "right_divested" && isBuy) return L.right_bought.slice();
      return L[name] ? L[name].slice() : [name];
    }

    function applyUiLanguage() {
      const t = I18N[currentLang];
      document.documentElement.lang = currentLang;
      document.getElementById("langLabel").textContent = t.langLabel;
      document.getElementById("btnSvg").textContent = t.btnSvg;
      document.getElementById("btnPng").textContent = t.btnPng;
    }

    function positionTooltip(e) {
      const tt = tooltip.node();
      const padding = 6;
      const tooltipWidth = tt.offsetWidth || 150;

      let x = e.pageX + padding;
      if (e.pageX + tooltipWidth + 2 * padding > window.innerWidth) {
        x = e.pageX - tooltipWidth - padding;
      }
      tooltip.style("left", x + "px").style("top", (e.pageY - 6) + "px");
    }

    // Vertically center a multi-line label around y by shifting the first line upward
    function setMultilineTextCentered(textSel, lines, x, lineDy = 1.15) {
      textSel.selectAll("tspan").remove();
      const n = lines.length;
      const firstDy = (n <= 1) ? 0 : (-(n - 1) / 2) * lineDy;

      lines.forEach((line, i) => {
        textSel.append("tspan")
          .attr("x", x)
          .attr("dy", i === 0 ? `${firstDy}em` : `${lineDy}em`)
          .text(line);
      });
    }

    // ============================================================
    // Main chart
    // ============================================================
    function loadChart(prefix) {
      svg.selectAll("*").remove();

      const desiredOrder = new Map([
        ["right_divested", 0],
        ["right_renamed", 1],
        ["right_esi", 2],
        ["left_fossil", 0]
      ]);

      const sankeyGen = d3.sankey()
        .nodeWidth(20)
        .nodePadding(10)
        .extent([[1, 1], [width - 1, height - 1]])
        .nodeAlign(d3.sankeyJustify)
        .nodeSort((a, b) => (desiredOrder.get(a.name) ?? 999) - (desiredOrder.get(b.name) ?? 999))
        .linkSort((a, b) => {
          const aT = a.target?.name ?? a.targetName ?? "";
          const bT = b.target?.name ?? b.targetName ?? "";
          const aS = a.source?.name ?? a.sourceName ?? "";
          const bS = b.source?.name ?? b.sourceName ?? "";

          const dt = (desiredOrder.get(aT) ?? 999) - (desiredOrder.get(bT) ?? 999);
          if (dt !== 0) return dt;

          return (desiredOrder.get(aS) ?? 999) - (desiredOrder.get(bS) ?? 999);
        });

      Promise.all([
        d3.csv(`${prefix}_nodes.csv`),
        d3.csv(`${prefix}_links.csv`)
      ]).then(([nodesRaw, linksRaw]) => {
        const N = nodesRaw.length;

        // Map: display_mio per category (used in tooltips/export)
        const displayByName = new Map(
          nodesRaw.map(d => [String(d.kategorie || "").trim(), +d.display_mio])
        );

        // Determine if divested is "buy" based on LINKS value (signed)
        const divLink = linksRaw.find(d => String(d.target_kategorie || "").trim() === "right_divested");
        const divIsBuy = divLink ? (+divLink.value < 0) : false;

        // Build sankey nodes (duplicate left/right)
        const sankeyNodes = nodesRaw
          .map(d => ({
            name: String(d.kategorie || "").trim(),
            color: d.color,
            col: "L",
            display: +d.display_mio
          }))
          .concat(
            nodesRaw.map(d => ({
              name: String(d.kategorie || "").trim(),
              color: d.color,
              col: "R",
              display: +d.display_mio
            }))
          );

        // Build links: abs() for geometry; keep signed for logic
        const sankeyLinks = linksRaw
          .map(d => {
            const sName = String(d.source_kategorie || "").trim();
            const tName = String(d.target_kategorie || "").trim();
            const s = nodesRaw.findIndex(n => String(n.kategorie || "").trim() === sName);
            const t = nodesRaw.findIndex(n => String(n.kategorie || "").trim() === tName);
            if (s < 0 || t < 0) return null;

            const signed = +d.value;
            return {
              source: s,
              target: N + t,
              value: Math.abs(signed),   // geometry
              signedValue: signed,       // logic
              targetName: tName
            };
          })
          .filter(Boolean);

        // If divested is negative (=buy), recolor that link + node to brown
        if (divIsBuy) {
          const brown = "#B23A48";
          sankeyLinks.forEach(L => { if (L.targetName === "right_divested") L._forceColor = brown; });
          sankeyNodes.forEach(n => { if (n.name === "right_divested") n.color = brown; });
        }

        const { nodes: Gnodes, links: Glinks } = sankeyGen({ nodes: sankeyNodes, links: sankeyLinks });
        const visibleNodes = Gnodes.filter(d => d.value > 0);

        // Gradients
        const defs = svg.append("defs");
        Glinks.forEach((link, i) => {
          const srcColor = sankeyNodes[link.source.index].color;
          const tgtColor = link._forceColor || sankeyNodes[link.target.index].color;

          const grad = defs.append("linearGradient")
            .attr("id", `grad${i}`)
            .attr("gradientUnits", "userSpaceOnUse")
            .attr("x1", link.source.x1)
            .attr("x2", link.target.x0);

          grad.append("stop").attr("offset", "0%").attr("stop-color", srcColor);
          grad.append("stop").attr("offset", "100%").attr("stop-color", tgtColor);
        });

        // Links (tooltip only)
        svg.append("g")
          .selectAll("path")
          .data(Glinks)
          .enter().append("path")
          .attr("class", "link")
          .attr("d", d3.sankeyLinkHorizontal())
          .attr("stroke-width", d => Math.max(1, d.width))
          .attr("stroke", (d, i) => `url(#grad${i})`)
          .on("mouseover", (e, d) => {
            svg.classed("dimmed", true);
            d3.select(e.currentTarget).classed("highlight", true);

            const signed = (d.signedValue !== undefined) ? d.signedValue : d.value;
            tooltip.style("opacity", 1).html(`${formatMio(Math.abs(signed))}`);
            positionTooltip(e);
          })
          .on("mousemove", positionTooltip)
          .on("mouseout", () => {
            svg.classed("dimmed", false);
            d3.selectAll(".link").classed("highlight", false);
            tooltip.style("opacity", 0);
          });

        // Headings (bold)
        const t = I18N[currentLang];
        const leftNodes = visibleNodes.filter(d => d.col === "L");
        const rightNodes = visibleNodes.filter(d => d.col === "R");
        const leftX = d3.min(leftNodes, d => d.x0);
        const rightX = d3.max(rightNodes, d => d.x1);

        svg.append("text")
          .attr("class", "col-heading")
          .attr("x", leftX)
          .attr("y", -15)
          .attr("text-anchor", "start")
          .style("font-size", "12px")
          .style("font-weight", "700")
          .text(t.colLeft);

        svg.append("text")
          .attr("class", "col-heading")
          .attr("x", rightX - 6)
          .attr("y", -15)
          .attr("text-anchor", "end")
          .style("font-size", "12px")
          .style("font-weight", "700")
          .text(t.colRight);

        // Nodes (tooltip only)
        const node = svg.append("g")
          .selectAll("g")
          .data(visibleNodes)
          .enter().append("g")
          .attr("class", "node")
          .attr("transform", d => `translate(${d.x0},${d.y0})`)
          .on("mouseover", (e, d) => {
            svg.classed("dimmed", true);
            d3.select(e.currentTarget).classed("highlight", true);

            const isBuy = (d.name === "right_divested" && divIsBuy);
            const shownLabel = labelLines(d.name, isBuy).join(" ");
            const displayVal = Number.isFinite(d.display) ? d.display : Math.abs(d.value);

            tooltip.style("opacity", 1).html(`${shownLabel}: ${formatMio(Math.abs(displayVal))}`);
            positionTooltip(e);
          })
          .on("mousemove", positionTooltip)
          .on("mouseout", () => {
            svg.classed("dimmed", false);
            d3.selectAll(".node").classed("highlight", false);
            tooltip.style("opacity", 0);
          });

        node.append("rect")
          .attr("width", sankeyGen.nodeWidth())
          .attr("height", d => d.y1 - d.y0)
          .attr("fill", d => d.color);

        // OUTSIDE LABELS
        const labelsLayer = svg.append("g").attr("class", "outside-labels");

        labelsLayer.selectAll("text")
          .data(visibleNodes)
          .enter().append("text")
          .attr("class", "outside-label")
          .attr("x", d => (d.col === "L" ? -12 : width + 12))
          .attr("y", d => (d.y0 + d.y1) / 2)
          .attr("text-anchor", d => (d.col === "L" ? "end" : "start"))
          .attr("dominant-baseline", "middle")
          .style("font-family", "Barlow, sans-serif")
          .style("font-size", "12px")
          .attr("data-name", d => d.name)
          .attr("data-col", d => d.col)
          .attr("data-display", d => {
            const v = displayByName.get(d.name);
            return Number.isFinite(v) ? v : Math.abs(d.value);
          })
          .attr("data-isbuy", d => (d.name === "right_divested" && divIsBuy) ? "1" : "0")
          .each(function (d) {
            const x = (d.col === "L") ? -12 : (width + 12);
            const isBuy = (d.name === "right_divested" && divIsBuy);
            setMultilineTextCentered(d3.select(this), labelLines(d.name, isBuy), x);
          });

      }).catch(err => {
        console.error(err);
        showDebug("Fehler beim Laden der CSVs. Liegen esi_pab_nodes.csv und esi_pab_links.csv neben index.html? (und nicht in Unterordnern)");
      });
    }

    // ============================================================
    // Export helpers
    // ============================================================
    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function injectExportStyles(svgElClone) {
      svgElClone.setAttribute("font-family", "Barlow, sans-serif");
      const styleEl = document.createElementNS("http://www.w3.org/2000/svg", "style");
      styleEl.textContent = `
        text { font-family: Barlow, sans-serif; font-size: 12px; }
        text.outside-label { font-size: 12px; dominant-baseline: middle; }
        text.col-heading { font-size: 12px; font-weight: 700; }
      `;
      svgElClone.insertBefore(styleEl, svgElClone.firstChild);
    }

    // Export: numbers on own line for all labels EXCEPT Divested/Bought ("right_divested")
    function addNumbersToClonedSVG(svgElClone) {
      const labelTexts = svgElClone.querySelectorAll("text.outside-label");

      labelTexts.forEach(t => {
        const name = t.getAttribute("data-name");
        const displayVal = Math.abs(Number(t.getAttribute("data-display")));

        const tspans = Array.from(t.querySelectorAll("tspan"));
        if (tspans.length === 0) return;

        const last = tspans[tspans.length - 1];
        const x = last.getAttribute("x") || tspans[0].getAttribute("x") || "0";

        const oneLine = (name === "right_divested"); // Divested/Bought stays one line

        if (oneLine) {
          last.textContent = `${last.textContent}: ${formatMio(displayVal)}`;
          return;
        }

        const tspanNum = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
        tspanNum.setAttribute("x", x);
        tspanNum.setAttribute("dy", "1.15em");
        tspanNum.textContent = `${formatMio(displayVal)}`;
        t.appendChild(tspanNum);
      });
    }

    function serializeSVG(svgEl) {
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svgEl);

      if (!source.match(/^<svg[^>]+xmlns=/)) {
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      if (!source.match(/^<svg[^>]+"http:\/\/www.w3.org\/1999\/xlink"/)) {
        source = source.replace(/^<svg/, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
      }
      return source;
    }

    function downloadSVGWithNumbers(filename) {
      const svgEl = d3.select("#chart").select("svg").node();
      const clone = svgEl.cloneNode(true);

      const vb = svgEl.viewBox && svgEl.viewBox.baseVal ? svgEl.viewBox.baseVal : null;
      if (vb) {
        clone.setAttribute("width", vb.width);
        clone.setAttribute("height", vb.height);
      }

      injectExportStyles(clone);
      addNumbersToClonedSVG(clone);

      const source = serializeSVG(clone);
      const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
      downloadBlob(blob, filename);
    }

    function downloadPNGWithNumbers(filename, scale = 4) {
      const svgEl = d3.select("#chart").select("svg").node();
      const clone = svgEl.cloneNode(true);

      const vb = svgEl.viewBox && svgEl.viewBox.baseVal ? svgEl.viewBox.baseVal : null;
      const w = vb ? vb.width : fullW;
      const h = vb ? vb.height : fullH;

      clone.setAttribute("width", w);
      clone.setAttribute("height", h);

      injectExportStyles(clone);
      addNumbersToClonedSVG(clone);

      const svgString = serializeSVG(clone);
      const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(blob => {
          downloadBlob(blob, filename);
          URL.revokeObjectURL(url);
        }, "image/png");
      };

      img.onerror = (e) => {
        console.error("PNG export failed", e);
        URL.revokeObjectURL(url);
      };

      img.src = url;
    }

    // ============================================================
    // Wire up
    // ============================================================
    document.getElementById("langSelect").addEventListener("change", function () {
      currentLang = this.value;

      // ✅ Keep URL in sync for deep-linking
      setLangInUrl(currentLang);

      applyUiLanguage();
      loadChart(DATA_PREFIX); // redraw same data, new language
    });

    document.getElementById("btnSvg").addEventListener("click", () => {
      downloadSVGWithNumbers(`sankey_${DATA_PREFIX}_${currentLang}.svg`);
    });

    document.getElementById("btnPng").addEventListener("click", () => {
      downloadPNGWithNumbers(`sankey_${DATA_PREFIX}_${currentLang}.png`, 4);
    });

    // initial draw
    applyUiLanguage();

    // ✅ Ensure URL includes lang on first load (nice for copy/paste)
    setLangInUrl(currentLang);

    loadChart(DATA_PREFIX);
  </script>
</body>

</html>
